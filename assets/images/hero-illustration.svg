<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">

  <!-- Soft mint blob background -->
  <path d="
    M 200 220
    q 30 -90 150 -110
    q 180 -30 280 60
    q 110 100 60 220
    q -50 130 -200 150
    q -180 25 -280 -70
    q -80 -80 -10 -250
    z" fill="#E4F2EE"/>

  <!-- Dark teal circle behind PDF (shadow base) -->
  <circle cx="400" cy="350" r="110" fill="#0F6E5F" opacity="0.9"/>

  <!-- Isometric PDF card shadow -->
  <path d="
    M 300 300
    L 400 250
    L 520 315
    L 420 375
    z" fill="#0A4A3F" opacity="0.35"/>

  <!-- Main PDF card (isometric) -->
  <path d="
    M 290 285
    L 400 230
    L 520 295
    L 410 355
    z" fill="#FFFFFF" stroke="#0A4A3F" stroke-width="5" stroke-linejoin="round"/>

  <!-- PDF label badge -->
  <path d="
    M 360 285
    L 410 260
    L 460 288
    L 410 313
    z" fill="#0F6E5F"/>
  <text x="410" y="296" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">PDF</text>

  <!-- Document lines -->
  <path d="M 355 330 L 465 275" stroke="#C8D5D1" stroke-width="7" stroke-linecap="round"/>
  <path d="M 370 345 L 480 290" stroke="#C8D5D1" stroke-width="7" stroke-linecap="round"/>
  <path d="M 385 360 L 495 305" stroke="#C8D5D1" stroke-width="7" stroke-linecap="round"/>

  <!-- Green checkmark bubble (right) -->
  <circle cx="560" cy="235" r="34" fill="#14C4A5"/>
  <path d="M 545 235 l 11 12 l 20 -22" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 100 KB badge (top-right) -->
  <g transform="rotate(-8 490 130)">
    <rect x="390" y="95" width="200" height="80" rx="14" fill="#FFFFFF" stroke="#0A4A3F" stroke-width="4"/>
    <text x="490" y="140" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#0F6E5F" text-anchor="middle">100 KB</text>
    <text x="490" y="163" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0F6E5F" text-anchor="middle">PDF Compression</text>
  </g>

  <!-- Curved arrow from card to 100KB badge -->
  <path d="
    M 480 250
    q 30 -60 70 -90
    q 20 -15 30 -20"
    fill="none"
    stroke="#0F6E5F"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="9 8"/>
  <path d="M 570 145 l 18 -8 l -4 22 z" fill="#0F6E5F"/>

  <!-- Paperclip (left) -->
  <g transform="rotate(-25 250 280)">
    <path d="
      M 240 250
      v 90
      a 16 16 0 0 0 32 0
      v -100
      a 24 24 0 0 0 -48 0
      v 105
      a 14 14 0 0 0 28 0
      v -85
      "
      fill="none"
      stroke="#0F6E5F"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.55"/>
  </g>

  <!-- Folder with zipper (bottom-left) -->
  <g>
    <rect x="180" y="400" width="130" height="90" rx="10" fill="#C6E8DE" stroke="#0F6E5F" stroke-width="4"/>
    <path d="M 180 420 h 130" stroke="#0F6E5F" stroke-width="4"/>
    <rect x="230" y="405" width="30" height="12" rx="4" fill="#0F6E5F" opacity="0.5"/>
    <!-- Zipper line -->
    <line x1="300" y1="430" x2="300" y2="480" stroke="#0F6E5F" stroke-width="3" stroke-dasharray="3 4"/>
    <!-- Arrow -->
    <path d="M 200 445 h 70 v -10 l 22 20 l -22 20 v -10 h -70 z" fill="#0F6E5F"/>
  </g>

  <!-- Image icon (bottom-right) -->
  <g>
    <rect x="510" y="400" width="120" height="90" rx="10" fill="#FFFFFF" stroke="#E8A33D" stroke-width="4"/>
    <rect x="522" y="412" width="96" height="66" rx="6" fill="#FCEBCB"/>
    <circle cx="560" cy="435" r="8" fill="#E8A33D"/>
    <path d="M 522 470 L 550 445 L 575 465 L 590 455 L 618 478 L 522 478 Z" fill="#0F6E5F"/>
  </g>

  <!-- Small teal quarter shapes (top) -->
  <path d="M 300 180 q 30 0 30 30 q -30 0 -30 -30 z" fill="#14C4A5"/>

  <!-- Small dots -->
  <circle cx="640" cy="330" r="5" fill="#14C4A5"/>

</svg>
