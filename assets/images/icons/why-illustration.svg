<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Soft blobs background -->
  <path d="M 240 200 q 60 -100 180 -80 q 160 25 170 150 q 10 130 -100 180 q -140 60 -240 -20 q -80 -70 -10 -230 z" fill="#E7F1EE"/>

  <!-- Laptop base -->
  <rect x="220" y="240" width="360" height="220" rx="14" fill="#FFFFFF" stroke="#0A5445" stroke-width="6"/>
  <rect x="240" y="260" width="320" height="180" rx="6" fill="#F7FAF9"/>
  <rect x="200" y="455" width="400" height="16" rx="8" fill="#0A5445"/>

  <!-- Shield with checkmark -->
  <path d="M 400 300 l -55 22 v 55 c 0 42 30 78 55 88 c 25 -10 55 -46 55 -88 v -55 z" fill="#7BC9A8" stroke="#0A5445" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 375 385 l 18 18 l 34 -36" fill="none" stroke="#0A5445" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rocket -->
  <path d="M 520 130 q 60 -40 90 10 q 25 45 -15 100 l -30 30 l -15 -15 l -20 15 l -10 -30 l -30 -10 l 15 -20 z" fill="#FFFFFF" stroke="#0A5445" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="565" cy="175" r="12" fill="#0A5445"/>
  <path d="M 500 200 q -40 30 -70 80" fill="none" stroke="#0A5445" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 8"/>
  <path d="M 555 245 q -30 30 -80 40" fill="none" stroke="#0A5445" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 8"/>

  <!-- Floating doc (top-left) -->
  <path d="M 300 130 h 60 l 20 20 v 70 h -80 z" fill="#E7F1EE" stroke="#0A5445" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 360 130 v 20 h 20 z" fill="#7BC9A8"/>

  <!-- Floating doc (right) -->
  <path d="M 590 300 h 55 l 18 18 v 65 h -73 z" fill="#E7F1EE" stroke="#0A5445" stroke-width="5" stroke-linejoin="round"/>

  <!-- Lightning -->
  <path d="M 400 155 l -20 45 h 25 l -15 45 l 45 -60 h -25 l 15 -30 z" fill="#E8A33D"/>

  <!-- Padlock (bottom-left) -->
  <rect x="175" y="400" width="34" height="28" rx="5" fill="#0A5445"/>
  <path d="M 182 400 v -10 a 10 10 0 0 1 20 0 v 10" fill="none" stroke="#0A5445" stroke-width="5" stroke-linecap="round"/>
  <circle cx="192" cy="414" r="3" fill="#FFFFFF"/>
</svg>
