<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#178F80"/>
      <stop offset="100%" stop-color="#0D6E62"/>
    </linearGradient>

    <linearGradient id="softTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5F5F1"/>
      <stop offset="100%" stop-color="#D5EEE9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Soft illustration background -->
  <path
    d="M155 365
       C125 340 135 305 157 285
       C170 260 164 231 191 208
       C222 182 260 195 283 210
       C314 190 354 207 372 237
       C394 274 389 325 372 357
       C350 394 305 399 268 391
       C220 402 178 391 155 365Z"
    fill="url(#softTeal)"
  />

  <!-- Laptop screen -->
  <rect
    x="184" y="220"
    width="145"
    height="96"
    rx="7"
    fill="#FFFFFF"
    stroke="#147F70"
    stroke-width="4"
  />

  <!-- Laptop base -->
  <path
    d="M177 316
       H336
       L342 327
       C344 333 338 338 330 338
       H182
       C174 338 168 333 171 327
       Z"
    fill="url(#teal)"
  />

  <!-- Screen shield -->
  <path
    d="M233 245
       C242 249 251 251 256 252
       C263 251 272 249 280 245
       V268
       C280 285 270 296 256 303
       C242 296 233 285 233 268Z"
    fill="#CBEAE4"
    stroke="#147F70"
    stroke-width="4"
  />

  <!-- Shield check -->
  <path
    d="M245 269 L253 277 L269 261"
    fill="none"
    stroke="#147F70"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Rocket trail -->
  <path
    d="M257 245
       C276 218 292 197 316 179"
    fill="none"
    stroke="#147F70"
    stroke-width="7"
    stroke-linecap="round"
  />

  <path
    d="M268 252
       C287 223 302 204 321 190"
    fill="none"
    stroke="#B9E4DD"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Rocket -->
  <g transform="rotate(35 338 170)">

    <!-- Body -->
    <path
      d="M310 196
         C313 176 323 151 344 136
         C357 126 369 123 378 125
         C380 135 377 148 369 160
         C356 180 333 192 310 196Z"
      fill="url(#teal)"
    />

    <!-- Rocket window -->
    <circle cx="354" cy="145" r="8" fill="#FFFFFF"/>

    <!-- Left fin -->
    <path
      d="M316 180
         C302 178 294 187 288 199
         C300 201 311 197 319 191Z"
      fill="#147F70"
    />

    <!-- Right fin -->
    <path
      d="M349 178
         C358 186 363 197 363 208
         C353 204 345 195 341 186Z"
      fill="#147F70"
    />

    <!-- Flame -->
    <path
      d="M311 195
         C300 207 297 218 300 230
         C308 220 317 213 325 207
         C320 202 316 198 311 195Z"
      fill="#D89A20"
    />
  </g>

  <!-- Lightning -->
  <path
    d="M259 145
       L245 166
       H256
       L249 187
       L266 160
       H255Z"
    fill="#D89A20"
  />

  <!-- Top document -->
  <path
    d="M200 133
       H218
       L231 146
       V169
       C231 173 228 176 224 176
       H205
       C201 176 198 173 198 169
       V139
       C198 136 199 134 200 133Z"
    fill="#D9F0EC"
    stroke="#147F70"
    stroke-width="3"
  />

  <!-- Document fold -->
  <path
    d="M218 133
       V146
       H231"
    fill="none"
    stroke="#147F70"
    stroke-width="3"
  />

  <!-- Right documents -->
  <g transform="translate(335 232)">
    <path
      d="M0 7
         H15
         L25 17
         V40
         C25 44 22 46 19 46
         H4
         C2 46 0 43 0 40Z"
      fill="#D9F0EC"
      stroke="#4AADA1"
      stroke-width="2.5"
    />

    <path
      d="M15 7 V17 H25"
      fill="none"
      stroke="#4AADA1"
      stroke-width="2.5"
    />
  </g>

  <!-- Back document -->
  <path
    d="M329 242
       H344
       L354 252
       V275
       C354 279 351 281 348 281
       H333
       C331 281 329 278 329 275Z"
    fill="none"
    stroke="#147F70"
    stroke-width="2.5"
    opacity="0.65"
  />

  <!-- Lock -->
  <g transform="translate(155 278)">

    <!-- Shackle -->
    <path
      d="M7 18
         V11
         C7 2 14 -4 22 -4
         C30 -4 37 2 37 11
         V18"
      fill="none"
      stroke="#147F70"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Lock body -->
    <rect
      x="0"
      y="16"
      width="44"
      height="31"
      rx="5"
      fill="#147F70"
    />

    <!-- Keyhole -->
    <circle cx="22" cy="28" r="3.5" fill="#FFFFFF"/>
    <rect x="20.5" y="30" width="3" height="8" rx="1.5"
          fill="#FFFFFF"/>
  </g>

  <!-- Ground shadow -->
  <ellipse
    cx="256"
    cy="340"
    rx="105"
    ry="10"
    fill="#BDBDBD"
    opacity="0.65"
  />

</svg>
